name = "ovid"
main = "src/worker/index.ts"
compatibility_date = "2026-06-01"

[build]
command = "yarn build"

[assets]
directory = "./build"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ovid-db"
database_id = "df1769fb-c23b-4151-85cc-0e00ed591f2b"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "ovid"

[vars]
APP_URL = "https://ovid.ink"

# translate-book Workflow: durable translation orchestration (backend='cf'
# jobs). Inert unless a job is explicitly created with backend='cf' and
# started via POST /api/internal/translate-cf.
[[workflows]]
name = "translate-book"
binding = "TRANSLATE_WORKFLOW"
class_name = "TranslateBookWorkflow"

# Workers Logs: persist console output + invocation metrics in the dashboard
# (Observability → Logs). Full sampling — volume is well within plan limits.
[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set via `wrangler secret put`):
# - GOOGLE_OAUTH_CLIENT_ID
# - GOOGLE_OAUTH_CLIENT_SECRET

# Staging environment for testing
[env.staging]
name = "ovid-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ovid-db"
database_id = "df1769fb-c23b-4151-85cc-0e00ed591f2b"

[[env.staging.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "ovid"


[env.staging.vars]
APP_URL = "https://ovid-staging.drapor.workers.dev"

# wrangler environments don't inherit bindings — duplicate the workflow here.
# Distinct workflow name: workflow names are unique per account.
[[env.staging.workflows]]
name = "translate-book-staging"
binding = "TRANSLATE_WORKFLOW"
class_name = "TranslateBookWorkflow"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
